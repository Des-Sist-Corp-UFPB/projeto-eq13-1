services:
  postgres:
    image: postgres:16-alpine
    container_name: radar-tech-postgres-dev
    environment:
      POSTGRES_DB: radar_tech_dev
      POSTGRES_USER: radar_tech
      POSTGRES_PASSWORD: radar_tech_dev
    ports:
      - "5432:5432"
    volumes:
      - radar-tech-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_tech -d radar_tech_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  radar-tech-dev-data:
