<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Gestão de vagas', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="container admin-shell">
    <th:block th:replace="~{fragments/admin-nav :: adminNav}"></th:block>

    <div class="page-header">
        <div>
            <h1>Gestão de vagas</h1>
            <p class="u-muted">Publique, arquive ou remova vagas enviadas.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/vagas/nova}">
            <svg class="icon" aria-hidden="true"><use href="/images/icons.svg#icon-plus"></use></svg>
            <span>Nova vaga</span>
        </a>
    </div>

    <form class="filter-bar" th:action="@{/admin/vagas}" method="get">
        <input class="input" type="search" name="q" placeholder="Cargo ou empresa" th:value="${q}">
        <select class="select" name="status">
            <option value="">Todos os status</option>
            <option th:each="item : ${jobStatuses}" th:value="${item.name()}" th:selected="${selectedStatus == item.name()}" th:text="${item.label}"></option>
        </select>
        <select class="select" name="location">
            <option value="">Todos os modelos</option>
            <option th:each="type : ${locationTypes}" th:value="${type.name()}" th:selected="${selectedLocation == type.name()}" th:text="${type.label}"></option>
        </select>
        <button class="btn btn-primary" type="submit">Filtrar</button>
        <a class="btn btn-ghost" th:href="@{/admin/vagas}">Limpar</a>
    </form>

    <div class="table-wrap">
        <table class="data-table" data-admin-table>
            <thead>
            <tr><th>Vaga</th><th>Empresa</th><th>Modelo</th><th>Link</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody>
            <tr th:each="job : ${jobs}">
                <td>
                    <strong th:text="${job.title}">Título</strong><br>
                    <span class="u-muted u-text-small" th:text="|${job.seniority.label} / ${job.contractType.label}|">Nível</span>
                </td>
                <td th:text="${job.company}">Empresa</td>
                <td>
                    <span class="badge badge-teal" th:text="${job.locationType.label}">Modelo</span><br>
                    <span class="u-muted u-text-small" th:text="${job.city}">Cidade</span>
                </td>
                <td>
                    <a class="btn btn-outline btn-small" data-row-link th:if="${job.applyUrl != null && !job.applyUrl.isBlank()}" th:href="${job.applyUrl}" target="_blank" rel="noopener">Abrir</a>
                    <span class="u-muted u-text-small" th:if="${job.applyUrl == null || job.applyUrl.isBlank()}">Interna</span>
                </td>
                <td><span class="badge badge-navy" th:text="${job.status.label}">Status</span></td>
                <td>
                    <div class="row-actions">
                        <form th:action="@{/admin/vagas/{id}/publicar(id=${job.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-success btn-small" type="submit">
                                <svg class="icon icon--sm" aria-hidden="true"><use href="/images/icons.svg#icon-play"></use></svg>
                                <span>Publicar</span>
                            </button>
                        </form>
                        <form th:action="@{/admin/vagas/{id}/pendente(id=${job.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-outline btn-small" type="submit">
                                <svg class="icon icon--sm" aria-hidden="true"><use href="/images/icons.svg#icon-pause"></use></svg>
                                <span>Pendente</span>
                            </button>
                        </form>
                        <form th:action="@{/admin/vagas/{id}/arquivar(id=${job.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-outline btn-small" type="submit">
                                <svg class="icon icon--sm" aria-hidden="true"><use href="/images/icons.svg#icon-archive"></use></svg>
                                <span>Arquivar</span>
                            </button>
                        </form>
                        <form th:action="@{/admin/vagas/{id}/remover(id=${job.id})}" method="post" data-confirm="Remover esta vaga permanentemente? Esta ação não pode ser desfeita.">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-danger btn-small" type="submit">
                                <svg class="icon icon--sm" aria-hidden="true"><use href="/images/icons.svg#icon-trash"></use></svg>
                                <span>Remover</span>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${#lists.isEmpty(jobs)}" class="u-mt-6"
         th:replace="~{fragments/empty-state :: state('briefcase', 'Nenhuma vaga encontrada.', 'Ajuste os filtros ou crie uma nova vaga.')}"></div>
</div>
</html>
