<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Billing cancelado', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="billing-result-shell">
    <section class="card card-elevated billing-result-card">
        <span class="billing-result-icon is-canceled" aria-hidden="true">
            <svg class="icon icon--lg" aria-hidden="true"><use href="/images/icons.svg#icon-close"></use></svg>
        </span>
        <span class="badge u-mb-4">Cancelado</span>
        <h1>Checkout cancelado</h1>
        <p class="u-muted" th:text="${billingMessage}">Checkout cancelado.</p>
        <a class="btn btn-primary" th:href="@{/admin}">Voltar ao dashboard</a>
    </section>
</div>
</html>
