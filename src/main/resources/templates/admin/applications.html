<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Candidaturas', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="container admin-shell">
    <th:block th:replace="~{fragments/admin-nav :: adminNav}"></th:block>

    <div class="page-header">
        <div>
            <h1>Candidaturas</h1>
            <p class="u-muted">Pessoas interessadas nas vagas publicadas.</p>
        </div>
    </div>

    <div class="table-wrap">
        <table class="data-table">
            <thead>
            <tr><th>Candidato</th><th>Conta</th><th>Vaga</th><th>Contato</th><th>Mensagem</th><th>Currículo</th></tr>
            </thead>
            <tbody>
            <tr th:each="candidateApplication : ${applications}">
                <td>
                    <strong th:text="${candidateApplication.applicantName}">Nome</strong><br>
                    <span class="u-muted u-text-small" th:text="${#temporals.format(candidateApplication.createdAt, 'dd/MM/yyyy HH:mm')}">Data</span>
                </td>
                <td th:text="${candidateApplication.applicantUser != null ? candidateApplication.applicantUser.email : 'Visitante'}">Conta</td>
                <td th:text="${candidateApplication.job.title}">Vaga</td>
                <td>
                    <a th:href="|mailto:${candidateApplication.applicantEmail}|" th:text="${candidateApplication.applicantEmail}">email</a><br>
                    <a th:if="${candidateApplication.linkedinUrl != null && !candidateApplication.linkedinUrl.isBlank()}" th:href="${candidateApplication.linkedinUrl}" target="_blank" rel="noopener">Perfil</a>
                </td>
                <td th:text="${candidateApplication.message}">Mensagem</td>
                <td>
                    <a class="btn btn-outline btn-small" th:if="${candidateApplication.hasResume()}"
                       th:href="@{/admin/candidaturas/{id}/curriculo(id=${candidateApplication.id})}"
                       target="_blank" rel="noopener">Ver currículo</a>
                    <span class="u-muted u-text-small" th:unless="${candidateApplication.hasResume()}">Não anexado</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${#lists.isEmpty(applications)}" class="u-mt-6">
        <div th:replace="~{fragments/empty-state :: state('file-text', 'Nenhuma candidatura recebida ainda.', 'Quando alguém se candidatar a uma vaga interna, ela aparecerá aqui.')}"></div>
    </div>
</div>
</html>
