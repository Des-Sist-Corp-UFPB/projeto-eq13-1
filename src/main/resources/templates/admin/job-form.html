<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Nova vaga', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="container admin-shell">
    <th:block th:replace="~{fragments/admin-nav :: adminNav}"></th:block>

    <div class="page-header">
        <div>
            <h1>Nova vaga</h1>
            <p class="u-muted">Crie uma vaga diretamente como publicada.</p>
        </div>
        <a class="btn btn-outline" th:href="@{/admin/vagas}">Voltar</a>
    </div>

    <section class="card admin-form-card">
        <form class="js-loading-submit" th:action="@{/admin/vagas/nova}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="alert alert-error u-mb-4" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</div>

            <div class="form-field-row">
                <div class="form-field">
                    <label for="af-title">Cargo</label>
                    <input id="af-title" class="input" th:field="*{title}">
                </div>
                <div class="form-field">
                    <label for="af-company">Empresa</label>
                    <input id="af-company" class="input" th:field="*{company}">
                </div>
            </div>

            <div class="form-field">
                <label for="af-email">E-mail da empresa</label>
                <input id="af-email" class="input" th:field="*{companyEmail}">
            </div>

            <div class="form-field-row">
                <div class="form-field">
                    <label for="af-location">Modelo</label>
                    <select id="af-location" class="select" th:field="*{locationType}" data-location-field>
                        <option th:each="type : ${locationTypes}" th:value="${type.name()}" th:text="${type.label}"></option>
                    </select>
                </div>
                <div class="form-field" data-city-field>
                    <label for="af-city">Cidade</label>
                    <input id="af-city" class="input" th:field="*{city}" placeholder="Obrigatória para híbrida/presencial">
                    <span class="form-field__hint" data-city-hint>Obrigatório para vagas híbridas ou presenciais.</span>
                </div>
            </div>

            <div class="form-field-row">
                <div class="form-field">
                    <label for="af-seniority">Senioridade</label>
                    <select id="af-seniority" class="select" th:field="*{seniority}">
                        <option th:each="item : ${seniorities}" th:value="${item.name()}" th:text="${item.label}"></option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="af-contract">Contrato</label>
                    <select id="af-contract" class="select" th:field="*{contractType}">
                        <option th:each="item : ${contractTypes}" th:value="${item.name()}" th:text="${item.label}"></option>
                    </select>
                </div>
            </div>

            <div class="form-field">
                <label for="af-salary">Faixa salarial</label>
                <input id="af-salary" class="input" th:field="*{salaryRange}">
            </div>
            <div class="form-field">
                <label for="af-description">Descrição</label>
                <textarea id="af-description" class="textarea" th:field="*{description}"></textarea>
            </div>
            <div class="form-field">
                <label for="af-requirements">Requisitos</label>
                <textarea id="af-requirements" class="textarea" th:field="*{requirements}"></textarea>
            </div>
            <div class="form-field">
                <label for="af-apply-url">Link externo</label>
                <input id="af-apply-url" class="input" th:field="*{applyUrl}">
            </div>

            <button class="btn btn-primary" type="submit">Publicar vaga</button>
        </form>
    </section>
</div>
</html>
