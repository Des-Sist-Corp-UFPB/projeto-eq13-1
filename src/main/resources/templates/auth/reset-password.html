<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Redefinir senha', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="auth-shell">
    <section class="card card-elevated auth-card">
        <span class="badge badge-success">Novo acesso</span>
        <h1>Crie uma nova senha</h1>
        <p class="u-muted">Use entre 8 e 72 caracteres e evite senhas utilizadas em outros serviços.</p>

        <div class="alert alert-error u-mb-6" th:if="${!tokenValid}">
            <svg class="icon" aria-hidden="true"><use href="/images/icons.svg#icon-alert-circle"></use></svg>
            <span>Este link é inválido, já foi utilizado ou expirou. Solicite uma nova recuperação.</span>
        </div>

        <form class="js-loading-submit" th:if="${tokenValid}" th:action="@{/redefinir-senha}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{token}">
            <div class="alert alert-error u-mb-6" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            <div class="form-field">
                <label for="new-password">Nova senha</label>
                <input id="new-password" class="input" type="password" th:field="*{password}"
                       autocomplete="new-password" minlength="8" maxlength="72" autofocus>
                <span class="form-field__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <div class="form-field">
                <label for="confirm-password">Confirmar nova senha</label>
                <input id="confirm-password" class="input" type="password" th:field="*{confirmPassword}"
                       autocomplete="new-password" minlength="8" maxlength="72">
                <span class="form-field__error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </div>
            <button class="btn btn-primary btn-full" type="submit">Atualizar senha</button>
        </form>

        <p class="auth-footer-link" th:if="${!tokenValid}"><a th:href="@{/esqueci-senha}">Solicitar novo link</a></p>
        <p class="auth-footer-link"><a th:href="@{/login}">Voltar para o login</a></p>
    </section>
</div>
</html>
