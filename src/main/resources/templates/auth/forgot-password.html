<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Recuperar senha', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="auth-shell">
    <section class="card card-elevated auth-card">
        <span class="badge badge-success">Recuperação de acesso</span>
        <h1>Esqueceu sua senha?</h1>
        <p class="u-muted">Informe o e-mail cadastrado. Se a conta existir, enviaremos um link válido por 30 minutos.</p>

        <div class="alert alert-success u-mb-6" th:if="${requested}">
            <svg class="icon" aria-hidden="true"><use href="/images/icons.svg#icon-check"></use></svg>
            <span>Se o e-mail estiver cadastrado, você receberá as instruções em instantes.</span>
        </div>

        <form class="js-loading-submit" th:action="@{/esqueci-senha}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-field">
                <label for="recovery-email">E-mail</label>
                <input id="recovery-email" class="input" type="email" th:field="*{email}"
                       autocomplete="email" placeholder="voce@exemplo.com" autofocus>
                <span class="form-field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <button class="btn btn-primary btn-full" type="submit">Enviar link de recuperação</button>
        </form>

        <p class="auth-footer-link"><a th:href="@{/login}">Voltar para o login</a></p>
    </section>
</div>
</html>
