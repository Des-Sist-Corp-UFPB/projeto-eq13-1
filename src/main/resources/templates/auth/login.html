<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Entrar', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="auth-shell">
    <section class="card card-elevated auth-card">
        <span class="badge badge-success">Acesso</span>
        <h1>Entrar no Radar Tech</h1>
        <p class="u-muted">Use e-mail, usuário e senha ou entre com Google.</p>

        <div class="alert alert-error u-mb-6" th:if="${param.error}">
            <svg class="icon" aria-hidden="true"><use href="/images/icons.svg#icon-alert-circle"></use></svg>
            <span>Não foi possível entrar. Confira seus dados.</span>
        </div>
        <div class="alert alert-success u-mb-6" th:if="${registered}">
            <svg class="icon" aria-hidden="true"><use href="/images/icons.svg#icon-check"></use></svg>
            <span>Cadastro criado. Entre para continuar.</span>
        </div>

        <div class="auth-options">
            <a class="btn-google" th:href="@{/oauth2/authorization/google}" aria-label="Entrar com Google">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="#4285F4" d="M23.49 12.27c0-.82-.07-1.6-.21-2.36H12v4.46h6.45a5.52 5.52 0 0 1-2.39 3.62v2.96h3.87c2.26-2.08 3.56-5.14 3.56-8.68z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.87-2.96c-1.07.72-2.44 1.14-4.07 1.14-3.13 0-5.78-2.11-6.72-4.95H1.29v3.06A11.99 11.99 0 0 0 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.33a7.2 7.2 0 0 1 0-4.66V6.61H1.29a11.99 11.99 0 0 0 0 10.78l3.99-3.06z"/>
                    <path fill="#EA4335" d="M12 4.72c1.76 0 3.34.6 4.58 1.79l3.44-3.44A11.52 11.52 0 0 0 12 0 11.99 11.99 0 0 0 1.29 6.61l3.99 3.06C6.22 6.83 8.87 4.72 12 4.72z"/>
                </svg>
                <span>Entrar com Google</span>
            </a>
        </div>

        <div class="auth-divider">ou</div>

        <form class="js-loading-submit" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-field">
                <label for="username">E-mail ou usuário</label>
                <input id="username" class="input" type="text" name="username" autocomplete="username" autofocus>
            </div>
            <div class="form-field">
                <label for="password">Senha</label>
                <input id="password" class="input" type="password" name="password" autocomplete="current-password">
            </div>
            <button class="btn btn-primary btn-full" type="submit">Entrar</button>
        </form>

        <p class="auth-footer-link">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    </section>
</div>
</html>
